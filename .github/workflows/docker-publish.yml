name: Publish frontend and backend images to GHCR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前阻断门禁：后端 lint/test/build + 真实启动冒烟（PostgreSQL/Redis/迁移/
  # main.js/worker.js//health）。任一失败都不会推送 latest 或 sha-* 镜像，
  # 防止"编译通过但进程起不来"的故障再次进入 GHCR（参考 sha-9f6164f7 回滚事件）。
  verify:
    runs-on: ubuntu-latest
    # 产品面向中国用户，时间渲染按北京时间（产品语义）；runner 默认 UTC 会让
    # 依赖本地时区的时间断言必挂（如 ConsultationPanel 的「核对时间」测试）。
    env:
      TZ: Asia/Shanghai
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Runtime smoke (postgres + redis + migrate + api + worker + /health)
        run: node scripts/smoke-runtime.mjs

  # 前端流程门禁：编译通过之外，必须验证画像填写、结果、补充保存、
  # 日程入口及 v7.2 开关回退等真实浏览器链路。
  frontend-verify:
    runs-on: ubuntu-latest
    # 同 verify：时间渲染按北京时间，避免 UTC runner 上的时区脆弱断言
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Frontend unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build E2E variants
        run: npm run pretest:e2e

      # M06（2026-10-27）恢复阻断门槛。历史 13-15 个失败已归因修复：
      # ① 本机 3100 被演示服务/常驻进程占用，v72 用例打到无关应用 → E2E v72 端口迁至 3123；
      # ② 登录字段在 e9d7518d（现场自助注册）中「账号」改为「邮箱」，E2E 未跟进 → 已同步。
      # 本地实测 25/25 通过（修复前 24 失败/1 过）。本步失败即阻断镜像发布。
      - name: Browser flow tests
        run: npm run test:e2e

  publish:
    needs: [verify, frontend-verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: ./Dockerfile
            suffix: ""
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            suffix: -api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
