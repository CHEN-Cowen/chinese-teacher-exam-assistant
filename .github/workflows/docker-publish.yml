name: Publish frontend and backend images to GHCR

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-monorepo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 发布前阻断门禁：后端 lint/test/build + 真实启动冒烟（PostgreSQL/Redis/迁移/
  # main.js/worker.js//health）。任一失败都不会推送 latest 或 sha-* 镜像，
  # 防止"编译通过但进程起不来"的故障再次进入 GHCR（参考 sha-9f6164f7 回滚事件）。
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build backend
        run: npm run build

      - name: Runtime smoke (postgres + redis + migrate + api + worker + /health)
        run: node scripts/smoke-runtime.mjs

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: frontend
            context: .
            dockerfile: ./Dockerfile
            suffix: ""
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            suffix: -api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push ${{ matrix.component }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
