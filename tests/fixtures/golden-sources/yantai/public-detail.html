	<p style="text-indent: 2em;">按照《2026年烟台职业学院第二批公开招聘高层次、高技能人才公告》规定，经考试、考察、体检等环节，卫乃硕等3人被确定为烟台职业学院拟聘用人员，现公示如下，公示期为5个工作日（名单附后）。公示期间如有异议，请与烟台市教育局人事科联系，监督电话：0535-2101861。</p><p style="text-indent: 2em;"><a href="/api-gateway/jpaas-web-server/front/document/download?fileUrl=YW5UzzlvCwcM%2FNHHX%2FtT6P5iSW0wxUhDHwICN8MFGpdS6WsIx1DVeimwAsDpliryt7T7gCEfMuNlGyevdZZZ%2FIDUGme%2FSj7JpICxjYFyHR8wLLl7JFuk3CECX4q0tuyExuAd3ONKFXuZ3c8kYGUcnAD439veWhCtDOV5qCCEMJ8%3D&fileName=2026%E5%B9%B4%E7%83%9F%E5%8F%B0%E8%81%8C%E4%B8%9A%E5%AD%A6%E9%99%A2%E7%AC%AC%E4%BA%8C%E6%89%B9%E5%85%AC%E5%BC%80%E6%8B%9B%E8%81%98%E9%AB%98%E5%B1%82%E6%AC%A1%E3%80%81%E9%AB%98%E6%8A%80%E8%83%BD%E4%BA%BA%E6%89%8D%E5%85%AC%E7%A4%BA%EF%BC%88%E4%B8%80%EF%BC%89.xls" data-link="/cms_files/filemanager/48848/attach/202610/d98036b92c2348ecba1aed0b26234aad.xls">2026年烟台职业学院第二批公开招聘高层次、高技能人才公示（一）.xls</a></p><p style="text-indent: 2em; text-align: right;">烟台市教育局</p><p style="text-indent: 2em; text-align: right;">2026年10月30日</p>
