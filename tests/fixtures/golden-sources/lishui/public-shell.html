		    <script>
		        // 新闻图片轮播js
		        window.onload = function() {
		            // 新闻图片
		            var oul = $('.ls_main_l ul');
		            var ali = $('.ls_main_l ul li');
		            var numLi = $('.ls_main_l ol li');
		            var aliWidth = $('.ls_main_l ul li').eq(0).width();
		            var _now = 0; //这个是控制数字样式的计数器
		            var _now2 = 0; //这个是控制图片运动距离的计数器
		            var timeId;
		            var aimg = $('.ls_main_l ul img');
		            var op = $('.ls_main_l .ls_introduce');
		            oul.attr('left',0);
		            numLi.eq(_now).addClass('ls_current').siblings().removeClass();
		            var imgAlt = aimg.eq(_now).attr('alt');
		            op.html(imgAlt);
		            numLi.click(function () {
		                var index = $(this).index();
		                _now = index;
		                _now2 = index;
		                var imgAlt = aimg.eq(_now).attr('alt');
		                op.html(imgAlt);
		    
		                $(this).addClass('ls_current').siblings().removeClass();
		                oul.animate({
		                    'left': -$('.ls_main_l ul li').eq(0).width() * index
		                }, 500);
		            });
		            window.slider = function() {
		                if (_now == numLi.length - 1) {
		                    ali.eq(0).css({
		                        'position': 'relative',
		                        'left': '2150px'
		                    });
		                    _now = 0;
		                } else {
		                    _now++;
		                }
		                _now2++;
		                numLi.eq(_now).addClass('ls_current').siblings().removeClass();
		                var imgAlt = aimg.eq(_now).attr('alt');
		                op.html(imgAlt);
		                if (_now == 0) {
		                    ali.eq(0).css('position', 'static');
		                    oul.css('left', 0);
		                    _now2 = 0;
		                }else{
		                    oul.animate({
		                        'left': -$('.ls_main_l ul li').eq(0).width() * _now2
		                    }, 400);
		                }
		            }
		            window.timeId = setInterval(function(){window.slider()}, 3000);
		            $('.ls_main_l').hover(function () {
		                clearInterval(window.timeId);
		            }, function () {
		                window.timeId = setInterval(function(){window.slider()}, 3000);
		            });
		        }
		    </script>

	<script>
		// 判断移动端
		var mobileAgent = new Array("iphone", "ipod", "ipad", "android", "mobile", "blackberry", "webos", "incognito",
		"webmate", "bada", "nokia", "lg", "ucweb", "skyfire");
		var browser = navigator.userAgent.toLowerCase();
		var isMobile = false;
		var element = document.getElementById("login-app");
		for (var i = 0; i < mobileAgent.length; i++) {
			if (browser.indexOf(mobileAgent[i]) != -1) {
				isMobile = true;
				element.innerHTML = "<div id="\"login\""><span class="\"login\"">登录</span></div>";
			}
		}
		//移动端适老化
		if (isMobile) {
			//$('.link-old').css('display', 'none');
			$('html').addClass('app-type');
			if (sessionStorage.oldApp == 'true') {
				$('html').addClass('app-old-type');
			} else if (sessionStorage.oldApp == null || sessionStorage.oldApp == undefined) {
				sessionStorage.oldApp = false;
			}
			//字体适配
			if (sessionStorage.oldAppFont == '1') {
				$('html').addClass('large1');
			} else if (sessionStorage.oldAppFont == '2') {
				$('html').addClass('large2');
			} else {
				$('html').removeClass('large1');
				$('html').removeClass('large2');
				sessionStorage.oldAppFont = '0';
			}
			setTimeout(function() {
				if ($('.ariaiconmobileExit1')[0]) {
					$('.ariaiconmobileExit1')[0].addEventListener('click', function(){
						$('html').removeClass('app-old-type');
						sessionStorage.oldApp = false;
					});
					$('.ariaiconmobileconfig1')[0].addEventListener('click', function(){
						setTimeout(function() {
							if ($('.menu-content-sz2')[0]) {
								$(".menu-content-sz2 label[scale='1']")[0].addEventListener('click', function(){
									$('html').removeClass('large1');
									$('html').removeClass('large2');
									sessionStorage.oldAppFont = '0';
								});
								$(".menu-content-sz2 label[scale='1.15']")[0].addEventListener('click', function(){
									$('html').removeClass('large2');
									$('html').addClass('large1');
									sessionStorage.oldAppFont = '1';
								});
								$(".menu-content-sz2 label[scale='1.3']")[0].addEventListener('click', function(){
									$('html').removeClass('large1');
									$('html').addClass('large2');
									sessionStorage.oldAppFont = '2';
								});
							}
						}, 500);
					});
				}
			}, 3000);
		}
		// 移动端 智能 "关怀版" 按钮点击退出 清除 body体 class : '.ariaMobileHeaderInBottom'
		// 注：ariaMobileHeaderInBottom 是上述js脚本半自动适配后body上的类名，利用body.ariaMobileHeaderInBottom .XXX ，选用父子层级选择器调整半自动适	    配后的DOM样式。退出 "关怀版" 模式就要清除调整后的代码，需要引入以下代码 .guanhuaiapp 为 "关怀版" 按钮类名。
		$('.guanhuaiapp')[0].addEventListener('click',function() {
			if (isMobile) {
				$('html').addClass('app-old-type');
				sessionStorage.oldApp = true;
				setTimeout(function() {
					$('.ariaiconmobileconfig1')[0].addEventListener('click', function(){
						setTimeout(function() {
							if ($('.menu-content-sz2')[0]) {
								$(".menu-content-sz2 label[scale='1']")[0].addEventListener('click', function(){
									$('html').removeClass('large1');
									$('html').removeClass('large2');
									sessionStorage.oldAppFont = '0';
								});
								$(".menu-content-sz2 label[scale='1.15']")[0].addEventListener('click', function(){
									$('html').removeClass('large2');
									$('html').addClass('large1');
									sessionStorage.oldAppFont = '1';
								});
								$(".menu-content-sz2 label[scale='1.3']")[0].addEventListener('click', function(){
									$('html').removeClass('large1');
									$('html').addClass('large2');
									sessionStorage.oldAppFont = '2';
								});
							}
						}, 500);
					});
					$('.ariaiconmobileExit1')[0].addEventListener('click', function(){
						$('html').removeClass('app-old-type');
						sessionStorage.oldApp = false;
					});
				}, 1000);
			}
		});
	//移动端适老化结束
	</script>
