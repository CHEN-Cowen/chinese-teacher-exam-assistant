  <h1 class="article-title">2026年10月杭州市教育局所属事业单位公开招聘教师公告（测试样本）</h1>
  <div class="article-meta">
    <span class="pub-date">发布日期：2026-10-09</span>
    <span class="source">来源：杭州市教育局</span>
  </div>
  <div class="article-content" id="zoom">
    <p>根据事业单位公开招聘有关规定，杭州市教育局所属事业单位决定面向社会公开招聘教师。现将有关事项公告如下：</p>
    <p>一、招聘单位和岗位：本次公开招聘教师共2名，岗位为高中语文教师，详见附件《岗位表》。</p>
    <p>二、招聘对象和条件：具有国家承认的本科及以上学历；具有相应学段学科的教师资格证。</p>
    <p>三、报名：报名时间自2026年10月10日至2026年10月20日，报名网址为杭州市教育局教师招聘报名系统。</p>
