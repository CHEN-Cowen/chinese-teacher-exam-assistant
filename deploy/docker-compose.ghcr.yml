# 经南京大学 GHCR 缓存镜像站拉取预构建镜像；镜像仍发布到 ghcr.io。
# 仅适用于可匿名拉取的公开 GHCR Package；私有镜像请改回 ghcr.io，勿向镜像站发送令牌。
# 未完成 ICP 备案前，使用 docker-compose.internal.yml 映射到服务器回环地址测试。
name: jiaozhao

x-backend: &backend
  image: ghcr.nju.edu.cn/${GHCR_OWNER:?Set GHCR_OWNER}/chinese-teacher-exam-assistant-api:${BACKEND_IMAGE_TAG:-latest}
  env_file: backend.env
  networks:
    - default
    - legacy-pg

services:
  # 抓取任务队列（BullMQ）：仅在 default 网络内可达，不对公网暴露端口。
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: npx prisma migrate deploy
    restart: on-failure:20

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - backend_snapshots:/app/.data
    restart: unless-stopped

  # 独立抓取 Worker：与 backend 同一镜像，改用 dist/worker.js 入口。
  # 无对外端口，只消费 Redis 队列；可独立暂停（stop worker / CRAWL_WORKER_PAUSED=true）
  # 与扩缩（--scale worker=N），其故障不影响 backend/前端。
  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - backend_snapshots:/app/.data
    restart: unless-stopped

  frontend:
    image: ghcr.nju.edu.cn/${GHCR_OWNER:?Set GHCR_OWNER}/chinese-teacher-exam-assistant:${FRONTEND_IMAGE_TAG:-latest}
    env_file: frontend.env
    depends_on:
      - backend
    restart: unless-stopped

  # 仅在域名备案、DNS 与 HTTPS 条件就绪后显式启用 --profile public。
  caddy:
    image: caddy:2-alpine
    profiles: [public]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$$SITE_DOMAIN" || { echo 'SITE_DOMAIN is required for public deployment' >&2; exit 1; };
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  backend_snapshots:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  # 当前轻量服务器已有 PostgreSQL 容器和 kaobian-net；本文件不重建数据库。
  legacy-pg:
    external: true
    name: kaobian-net
